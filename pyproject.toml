[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noetic-field"
version = "0.2.1"                      # keep equal to __version__ in __init__.py (tests/test_package.py checks it)
description = "A four-agent LLM pipeline for confabulation detection and values isolation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Whaley Jr." }]
keywords = ["llm", "confabulation", "values", "anthropic", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
# OpenRouter (any provider's model, one key) is reached through the openai package, imported only when it is used.
openrouter = ["openai>=1.0"]
# The HTTP interface (python -m noetic_field.api, or uvicorn noetic_field.api:app).
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0", "pydantic>=2.7.0"]
# Everything the test suite needs, so that none of it is skipped.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "openai>=1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.scripts]
noetic-field = "noetic_field.cli:main"

[project.urls]
Repository = "https://github.com/SaaSKing-0x4/noetic-field"
Homepage = "https://github.com/SaaSKing-0x4/noetic-field"

# ── what gets built ───────────────────────────────────────────────────────────
# The repository root is the package folder itself: the modules sit next to this file and import one another by
# their plain names when run from a source checkout (python cli.py, uvicorn api:app, the tests), and by relative
# imports when installed as the noetic_field package. The wheel therefore lists every file it ships, with the folder
# it goes into. test_package.py fails if a module is added to the folder and not to this list.

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "noetic_field/__init__.py"
"agents.py" = "noetic_field/agents.py"
"api.py" = "noetic_field/api.py"
"audit.py" = "noetic_field/audit.py"
"cli.py" = "noetic_field/cli.py"
"consoleutil.py" = "noetic_field/consoleutil.py"
"conversation.py" = "noetic_field/conversation.py"
"llm_json.py" = "noetic_field/llm_json.py"
"orchestrator.py" = "noetic_field/orchestrator.py"
"pipeline.py" = "noetic_field/pipeline.py"
"provider.py" = "noetic_field/provider.py"
"self_review.py" = "noetic_field/self_review.py"
"state.py" = "noetic_field/state.py"
"config.example.json" = "noetic_field/config.example.json"
"PROVIDERS_2026-11-04.md" = "noetic_field/PROVIDERS_2026-11-04.md"

# hatchling cannot map a flat folder to a package for an editable install (pip install -e .); this hook does it.
# It only acts on editable builds; see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/*.py",
    "/tests/*.py",
    "/config.example.json",
    "/PROVIDERS_2026-11-04.md",
    "/requirements.txt",
    "/requirements-dev.txt",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_backup_*", ".git", "build", "dist", "*.egg-info", "__pycache__"]
